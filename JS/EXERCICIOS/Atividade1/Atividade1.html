<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <section>
        <div>
            <input type="number" placeholder="Ano de nascimento?" id="idade">
            <br>
            <input type="radio" name="sex" id="M">Masculino
            <input type="radio" name="sex" id="F">Feminino
            <br>
            <input type="button" value="Verificar" onclick="Verificar()">
        </div>
        <div>
            <div id="res"></div>
        </div>
    </section>
    <footer>
        
    </footer>
    <script>
        var res = document.getElementById('res')
        var agora = new Date()
        var Ano = agora.getFullYear()

        var F = document.getElementById('F')
        var M = document.getElementById('M')
        var sex = ('')

        function Verificar(){
            var campo = document.getElementById('idade')
            var idade = Number(campo.value)

            if(campo.value.length == 0 || idade > Ano){
                alert('Prencha com seu ano de nascimento!')
                return
            }

            if( !M.checked && !F.checked ){ 
                alert('Escolha o sexo') 
                return 
            }

            var idade2 = Ano - idade
            var img = document.createElement('img')


            if(M.checked){
                sex = 'Masculino'
                if(idade2 <= 13){
                    img.src = 'imagens/criança-m.png'

                }else if(idade2 <= 20){
                    img.src = 'imagens/jovem-m.png'

                }else if(idade2 <= 50){
                    img.src = 'imagens/adulto-m.png'

                }else {
                    img.src = 'imagens/idoso-m.png'
                }

            }else{
                sex = 'Feminino'
                if(idade2 <= 13){
                    img.src = 'imagens/criança-f.png'

                }else if(idade2 <= 20){
                    img.src = 'imagens/jovem-f.png'

                }else if(idade2 <= 50){
                    img.src = 'imagens/adulto-f.png'

                }else {
                    img.src = 'imagens/idoso-f.png'
                }
            }

            res.innerHTML = `Você tem ${idade2} anos de idade e você é do sexo ${sex}`
            res.appendChild(img)
            
        }

        

    </script>
</body>
</html>
