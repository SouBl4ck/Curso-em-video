<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Meu primeiro programa</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 20px;
        }
        h1 {
            color: #007BFF;
        }
        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>Olá mundo</h1>

    <script>
       var nome = window.prompt("Qual é o seu nome?") // window.prompt() retorna uma string
       alert(`Olá, ${nome}! Seja bem-vindo(a)!`) // Concatenação de strings usando template strings
    </script>
