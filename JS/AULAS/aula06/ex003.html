<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            margin: 20px;
        }
        h1 {
            color: #007BFF;
        }
        p {
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>Olá mundo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Inventore iure praesentium laboriosam natus libero, non ut excepturi optio odio vero deleniti! Vel, distinctio sint? Minima temporibus asperiores pariatur nulla hic.</p>

    <script>
       var n1 = window.prompt("Digite um número: ") // window.prompt() retorna uma string

       var n2 = Number.parseInt(window.prompt("Digite outro número: ")) // Conversão de string para número inteiro

       var s = Number(n1) + n2 // Conversão de string para número
         alert(`A soma dos números é: ${s}`) // Concatenação de strings usando template strings

         // (number + number) para Adição
         // (string + string) para Concatenação
    </script>
</body>
</html>
