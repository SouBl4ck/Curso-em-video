<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistemas de multas</h1>

    Velocidade do carro <input type="number" id="txtvel"> Km/h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res"></div>

    <script>
        var txtv = document.getElementById('txtvel')
        var res = document.getElementById('res')

        function calcular() {
            var vel = Number(txtv.value)
            res.innerHTML = `<p>sua velocidade atual é de <strong>${vel}</strong> Km/h</p>`
            res.innerHTML += `<p>Dirija sempre com cinto de segunrança</p>`
            if(vel >= 80){
                res.innerHTML += `<p><strong>MULTADO, ultrapassou a velocidade permitida</strong></p>`
            }
        }
    </script>

</body>
</html>
