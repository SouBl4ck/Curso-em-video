<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
</head>
<style>
    div#area {
        font: normal 20pt Arial;
        background-color: #00ff37;
        color: #fff;
        width: 200px;
        height: 200px;
        line-height: 200px;
        text-align: center;
    }
</style>
<body>
    <div id="area">
        interaja...
    </div>

    <script>
        var area = document.getElementById("area");

        area.addEventListener("click", clicar);
        area.addEventListener("mouseenter", entrar);
        area.addEventListener("mouseout", sair);

        function clicar() {
            area.innerHTML = "Clicou!";
            area.style.background = "#ff0000";
        }

        function entrar() {
            area.innerHTML = "Entrou!";
            area.style.background = "#0000ff";
        }

        function sair() {
            area.innerHTML = "Saiu!";
            area.style.background = "#00ff37";
        }
    </script>
</body>
</html>
